name: Validate Services

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "receipts-function/**"
      - "form-submission-job/**"
      - "failure-dispatcher/**"
      - ".github/workflows/validate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "receipts-function/**"
      - "form-submission-job/**"
      - "failure-dispatcher/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate-infra:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
  validate-receipts-function:
    name: Validate receipts-function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: receipts-function/go.mod
          check-latest: true
          cache-dependency-path: receipts-function/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: receipts-function
          args: --timeout=5m
        continue-on-error: true

      - name: Run Taskfile Validate, Test & Build
        working-directory: receipts-function
        run: |
          ./Taskfile.sh validate
          ./Taskfile.sh test
          ./Taskfile.sh build

  validate-form-submission-job:
    name: Validate form-submission-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: form-submission-job/go.mod
          check-latest: true
          cache-dependency-path: form-submission-job/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: form-submission-job
          args: --timeout=5m
        continue-on-error: true

      - name: Run Taskfile Validate, Test & Build
        working-directory: form-submission-job
        run: |
          ./Taskfile.sh validate
          ./Taskfile.sh test
          ./Taskfile.sh build

  validate-failure-dispatcher:
    name: Validate failure-dispatcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: failure-dispatcher/go.mod
          check-latest: true
          cache-dependency-path: failure-dispatcher/go.sum

      - name: Run Taskfile Validate & Test
        working-directory: failure-dispatcher
        run: |
          ./Taskfile.sh validate
          ./Taskfile.sh test
