name: Deploy Services

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "receipts-function/**"
      - "form-submission-job/**"
      - "failure-dispatcher/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - infra
          - receipts-function
          - form-submission-job
          - failure-dispatcher

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-infra:
    name: Deploy Infrastructure (Terraform)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'infra'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Fetch GitHub PAT from Secret Manager
        id: gh-token
        run: |
          TOKEN=$(gcloud secrets versions access latest --secret="${{ vars.ACTION_DISPATCH_SECRET_ID }}" --project="${{ vars.GCP_PROJECT_ID }}")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Generate terraform.tfvars from repository variables
        working-directory: terraform
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'europe-west3' }}
          GEMINI_LOCATION: ${{ vars.GEMINI_LOCATION || 'eu' }}
          BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET || 'receipts_processing' }}
          BIGQUERY_LOCATION: ${{ vars.BIGQUERY_LOCATION || vars.GCP_REGION || 'europe-west3' }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'golang' }}
          GH_OWNER: ${{ vars.GH_OWNER || github.repository_owner }}
          GH_REPOSITORY: ${{ vars.GH_REPOSITORY || github.event.repository.name }}
          ENABLE_GITHUB_RESOURCES: ${{ vars.ENABLE_GITHUB_RESOURCES || 'true' }}
          WELLPASS_EMAIL: ${{ vars.WELLPASS_EMAIL }}
          WELLPASS_FIRST_NAME: ${{ vars.WELLPASS_FIRST_NAME }}
          WELLPASS_LAST_NAME: ${{ vars.WELLPASS_LAST_NAME }}
          WELLPASS_IBAN: ${{ vars.WELLPASS_IBAN || secrets.WELLPASS_IBAN }}
          WELLPASS_BIC: ${{ vars.WELLPASS_BIC }}
          SUBMISSION_DRY_RUN: ${{ vars.SUBMISSION_DRY_RUN || 'false' }}
          SCHEDULER_CRON: ${{ vars.SCHEDULER_CRON || '0 8 2 * *' }}
          SCHEDULER_TIME_ZONE: ${{ vars.SCHEDULER_TIME_ZONE || 'Europe/Berlin' }}
        run: |
          cat <<EOF > terraform.tfvars
          project_id                = "${PROJECT_ID}"
          region                    = "${REGION}"
          gemini_location           = "${GEMINI_LOCATION}"
          bigquery_dataset_id       = "${BIGQUERY_DATASET}"
          bigquery_location         = "${BIGQUERY_LOCATION}"
          artifact_registry_repo_id = "${ARTIFACT_REGISTRY_REPOSITORY}"
          github_owner              = "${GH_OWNER}"
          github_repository         = "${GH_REPOSITORY}"
          enable_github_resources   = ${ENABLE_GITHUB_RESOURCES}
          wellpass_email            = "${WELLPASS_EMAIL}"
          wellpass_first_name       = "${WELLPASS_FIRST_NAME}"
          wellpass_last_name        = "${WELLPASS_LAST_NAME}"
          wellpass_iban             = "${WELLPASS_IBAN}"
          wellpass_bic              = "${WELLPASS_BIC}"
          submission_dry_run        = ${SUBMISSION_DRY_RUN}
          scheduler_cron            = "${SCHEDULER_CRON}"
          scheduler_time_zone       = "${SCHEDULER_TIME_ZONE}"
          EOF

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ steps.gh-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: terraform apply -auto-approve -input=false

  deploy-receipts-function:
    name: Deploy receipts-function (Cloud Run Function)
    needs: [deploy-infra]
    if: |
      always() &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'receipts-function')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Cloud Run Function via Taskfile
        working-directory: receipts-function
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          GEMINI_LOCATION: ${{ vars.GEMINI_LOCATION }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SOURCE_BUCKET: ${{ vars.RECEIPTS_SOURCE_BUCKET }}
          TARGET_BUCKET: ${{ vars.RECEIPTS_TARGET_BUCKET }}
          FAILED_BUCKET: ${{ vars.RECEIPTS_FAILED_BUCKET }}
          BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET }}
          BIGQUERY_TABLE: ${{ vars.BIGQUERY_TABLE }}
          RECEIPTS_FUNCTION_SERVICE_ACCOUNT: ${{ vars.RECEIPTS_FUNCTION_SERVICE_ACCOUNT }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
        run: |
          ./Taskfile.sh deploy

  deploy-form-submission-job:
    name: Deploy form-submission-job (Cloud Run Job & Scheduler)
    needs: [deploy-infra]
    if: |
      always() &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'form-submission-job')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Cloud Run Job & Scheduler via Taskfile
        working-directory: form-submission-job
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SOURCE_BUCKET: ${{ vars.RECEIPTS_TARGET_BUCKET }}
          SUBMITTED_BUCKET: ${{ vars.RECEIPTS_SUBMITTED_BUCKET }}
          FAILED_BUCKET: ${{ vars.RECEIPTS_FAILED_BUCKET }}
          BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET }}
          BIGQUERY_TABLE: ${{ vars.BIGQUERY_TABLE }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
          SUBMISSION_JOB_SERVICE_ACCOUNT: ${{ vars.SUBMISSION_JOB_SERVICE_ACCOUNT }}
          TYPEFORM_URL: ${{ vars.WELLPASS_TYPEFORM_URL }}
          EMAIL: ${{ vars.WELLPASS_EMAIL }}
          FIRST_NAME: ${{ vars.WELLPASS_FIRST_NAME }}
          LAST_NAME: ${{ vars.WELLPASS_LAST_NAME }}
          IBAN: ${{ secrets.WELLPASS_IBAN }}
          BIC: ${{ vars.WELLPASS_BIC }}
          DRY_RUN: ${{ vars.SUBMISSION_DRY_RUN }}
        run: |
          ./Taskfile.sh deploy

  deploy-failure-dispatcher:
    name: Deploy failure-dispatcher (Pub/Sub Cloud Run Function)
    needs: [deploy-infra]
    if: |
      always() &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'failure-dispatcher')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Failure Dispatcher via Taskfile
        working-directory: failure-dispatcher
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PUBSUB_TOPIC: ${{ vars.JOB_FAILURES_PUBSUB_TOPIC }}
          FAILURE_DISPATCHER_SERVICE_ACCOUNT: ${{ vars.FAILURE_DISPATCHER_SERVICE_ACCOUNT }}
          GITHUB_OWNER: "5pirit5eal"
          GITHUB_REPOSITORY: "wellpass-autoform"
          ACTION_DISPATCH_SECRET_ID: ${{ vars.ACTION_DISPATCH_SECRET_ID }}
        run: |
          ./Taskfile.sh deploy
